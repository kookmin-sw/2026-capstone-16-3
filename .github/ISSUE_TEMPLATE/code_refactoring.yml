name: 코드 리팩토링 (Code Refactoring)
description: 더 나은 코드 구조나 성능 개선을 위한 리팩토링을 제안해주세요.
title: "[REFACTOR] "
labels: [refactor]
assignees: []

body:
  - type: dropdown
    id: layer
    attributes:
      label: 🗂️ 대상 레이어
      options:
        - Frontend (Flutter / Dart)
        - Server (Spring Boot / Java)
        - AI (FastAPI / Python)
    validations:
      required: true

  - type: input
    id: target-code
    attributes:
      label: 📁 대상 파일 / 모듈
      description: 리팩토링이 필요한 파일 경로나 클래스명을 작성해주세요.
      placeholder: 예) frontend/lib/screens/camera_screen.dart, ai/app/services/inference.py
    validations:
      required: true

  - type: textarea
    id: issue-description
    attributes:
      label: 🤔 현재 문제점
      description: 현재 코드에서 구조나 유지보수 측면에서 문제가 되는 점을 설명해주세요.
      placeholder: 예) inference.py에서 전처리, 추론, 후처리가 하나의 함수에 모두 있어 테스트와 수정이 어렵습니다.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 💡 개선 방향
      description: 어떻게 개선하면 좋을지 구체적인 리팩토링 제안을 적어주세요.
      placeholder: 예) preprocess / infer / postprocess 함수로 분리하고 각각 단위 테스트를 추가합니다.
    validations:
      required: true

  - type: textarea
    id: impact-scope
    attributes:
      label: ⚠️ 영향 범위
      description: 이 리팩토링이 다른 파일이나 기능에 영향을 줄 수 있는 부분을 작성해주세요.
      placeholder: 예) analyze.py의 run_single_image_inference 호출부, guide_builder.py에 영향이 있을 수 있습니다.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 💬 추가 내용
      description: 관련 PR, 참고 문서, 성능 측정 결과 등이 있다면 작성해주세요.
    validations:
      required: false
