name: 기능 요청 (Feature Request)
description: 새로운 기능이나 개선 아이디어를 제안해주세요.
title: "[FEATURE] "
labels: [enhancement]
assignees: []

body:
  - type: dropdown
    id: layer
    attributes:
      label: 🗂️ 관련 레이어
      description: 기능이 추가될 레이어를 선택해주세요.
      options:
        - Frontend (Flutter)
        - Server (Spring Boot)
        - AI (FastAPI / YOLO / SegFormer)
        - 전체 연동 (E2E)
        - 기타 / 해당 없음
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: 🧩 관련 도메인
      options:
        - auth (카카오 로그인 / 토큰)
        - guide (위험 감지 / 안내 이벤트)
        - navigation (경로 안내)
        - place (장소 검색)
        - user (사용자 정보)
        - weather (날씨)
        - AI 추론 (이미지 분석 / alert_level)
        - 기타 / 해당 없음
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: 🌟 기능 설명
      description: 원하는 기능이 무엇인지 명확하게 설명해주세요.
      placeholder: 예) 보행 중 횡단보도 신호등 상태를 감지해서 음성으로 안내해주는 기능이 필요합니다.
    validations:
      required: true

  - type: textarea
    id: why-needed
    attributes:
      label: 📌 필요 이유
      description: 이 기능이 왜 필요한지, 어떤 문제를 해결하는지 작성해주세요.
      placeholder: 예) 현재는 장애물 감지만 되고 신호 정보가 없어 교차로에서 사용자가 위험할 수 있습니다.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: ✅ 완료 기준 (Acceptance Criteria)
      description: 이 기능이 완성됐다고 판단할 수 있는 기준을 작성해주세요.
      placeholder: |
        - [ ] 카메라 프레임에서 신호등이 감지되면 alert_level에 반영된다
        - [ ] 빨간불 감지 시 "신호를 기다려주세요" 음성 안내가 출력된다
        - [ ] 초록불 감지 시 "건너도 됩니다" 음성 안내가 출력된다
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 💡 대안
      description: 생각해본 다른 방법이나 접근 방식이 있다면 적어주세요.
      placeholder: 예) OpenStreetMap의 신호등 정보를 좌표 기반으로 조회하는 방식도 고려했습니다.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 💬 추가 내용
      description: 참고 자료, 스크린샷, 관련 이슈 등 더 공유하고 싶은 내용이 있다면 작성해주세요.
    validations:
      required: false
